<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <title>komai_hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #111111;
      --s2:      #1a1a1a;
      --s3:      #222222;
      --border:  #2a2a2a;
      --border2: #333333;
      --accent:  #f97316;
      --accent2: #fbbf24;
      --text:    #f0f0f0;
      --muted:   #666666;
      --red:     #ef4444;
      --green:   #22c55e;
      --r:       12px;
      --glow:    0 0 32px rgba(249,115,22,.18);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 52px 20px 80px;
    }

    /* ══ HERO ══ */
    .hero { text-align: center; margin-bottom: 44px; }

    .hero-icon {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: grid; place-items: center;
      font-size: 30px; margin: 0 auto 20px;
      box-shadow: var(--glow);
    }

    .hero h1 {
      font-size: 2.2rem; font-weight: 900;
      letter-spacing: -.03em;
      background: linear-gradient(90deg, #fff 0%, var(--accent2) 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .hero p { font-size: .88rem; color: var(--muted); }

    /* ══ CARD ══ */
    .card {
      width: 100%; max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      margin-bottom: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .card-label {
      font-size: .68rem; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }

    /* ══ INPUT ══ */
    .input-row { display: flex; gap: 10px; }

    .url-input {
      flex: 1;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text); font-size: .92rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249,115,22,.12);
    }
    .url-input::placeholder { color: var(--muted); }

    .btn-dl {
      padding: 13px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 10px;
      color: #000; font-size: .9rem; font-weight: 800;
      cursor: pointer; white-space: nowrap;
      transition: opacity .2s, transform .1s;
      box-shadow: 0 4px 20px rgba(249,115,22,.35);
    }
    .btn-dl:hover   { opacity: .88; }
    .btn-dl:active  { transform: scale(.97); }
    .btn-dl:disabled { opacity: .4; cursor: not-allowed; }

    /* ══ PROGRESS ══ */
    .progress-wrap { margin-top: 20px; display: none; }
    .progress-wrap.visible { display: block; }

    .progress-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }
    .progress-label { font-size: .8rem; color: var(--muted); }
    .progress-pct   { font-size: .8rem; font-weight: 700; color: var(--accent); }

    .bar-track {
      width: 100%; height: 5px;
      background: var(--s3); border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width .4s ease;
    }
    .bar-fill.ind {
      width: 35% !important;
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { margin-left: -35%; }
      100% { margin-left: 100%; }
    }

    /* ══ STATUS CHIP ══ */
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 13px; border-radius: 99px;
      font-size: .78rem; font-weight: 600;
      margin-top: 12px;
      background: var(--s2); border: 1px solid var(--border);
      color: var(--muted); transition: all .25s;
    }
    .chip.loading { color: var(--accent);  border-color: rgba(249,115,22,.3); }
    .chip.ok      { color: var(--green);   border-color: rgba(34,197,94,.3);  }
    .chip.error   { color: var(--red);     border-color: rgba(239,68,68,.3);  }

    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ══ PLAYER CARD ══ */
    .player-card {
      width: 100%; max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: none;
      box-shadow: 0 8px 40px rgba(0,0,0,.5), var(--glow);
    }
    .player-card.visible { display: block; }
    .player-card::before {
      content: '';
      display: block; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .video-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
    }
    #player { width: 100%; height: 100%; display: block; }

    .video-spinner {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: rgba(0,0,0,.55);
      pointer-events: none; opacity: 0; transition: opacity .3s;
    }
    .video-spinner.on { opacity: 1; }
    .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-footer {
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      border-top: 1px solid var(--border);
    }
    .player-title {
      flex: 1; font-size: .88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tag-mp4 {
      font-size: .65rem; font-weight: 800;
      padding: 3px 8px; border-radius: 5px;
      background: rgba(249,115,22,.12);
      color: var(--accent);
      border: 1px solid rgba(249,115,22,.2);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <img src="https://raw.githubusercontent.com/Okomekomekome12/komai_hub/refs/heads/main/costume2.png" height="50%" width="50%"/>
  <p>動画URLを入力してダウンロード</p>
</div>

<!-- INPUT CARD -->
<div class="card">
  <div class="card-label">動画URL</div>
  <div class="input-row">
    <input class="url-input" id="urlInput"
           placeholder="https://jp.pornhub.com/view_video.php?viewkey=..."
           type="text"/>
    <button class="btn-dl" id="dlBtn" onclick="startDownload()">▶ 取得</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-head">
      <span class="progress-label" id="progressLabel">処理中...</span>
      <span class="progress-pct"   id="progressPct"></span>
    </div>
    <div class="bar-track">
      <div class="bar-fill ind" id="barFill"></div>
    </div>
    <div class="chip loading" id="chip">
      <span class="dot pulse"></span>
      <span id="chipText">接続中...</span>
    </div>
  </div>
</div>
  <p>一か月かけて遂に完成！！！！</p>
  <br>
  <p>サーバー側で動画をダウンロードしてその後ファイル変換などの処理があるので、最低でも30秒は掛かります</p>
  <br>
  <p>バグあったら教えてね</p>
<!-- PLAYER CARD -->
<div class="player-card" id="playerCard">
  <div class="video-wrap">
    <video id="player" controls playsinline></video>
    <div class="video-spinner" id="videoSpinner">
      <div class="spinner-ring"></div>
    </div>
  </div>
  <div class="player-footer">
    <div class="player-title" id="playerTitle">—</div>
    <span class="tag-mp4">MP4</span>
  </div>
</div>

<script>
  let hls = null;

  function setChip(text, type = 'loading') {
    const chip = document.getElementById('chip');
    const dot  = chip.querySelector('.dot');
    chip.className = `chip ${type}`;
    dot.className  = `dot${type === 'loading' ? ' pulse' : ''}`;
    document.getElementById('chipText').textContent = text;
  }

  function setBar(indeterminate, pct = 0, label = '処理中...') {
    const fill = document.getElementById('barFill');
    document.getElementById('progressLabel').textContent = label;
    document.getElementById('progressPct').textContent   = indeterminate ? '' : `${pct}%`;
    if (indeterminate) {
      fill.classList.add('ind');
      fill.style.width = '';
    } else {
      fill.classList.remove('ind');
      fill.style.width = `${pct}%`;
    }
  }

  async function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;

    const btn = document.getElementById('dlBtn');
    btn.disabled = true;

    document.getElementById('progressWrap').classList.add('visible');
    setBar(true, 0, 'ダウンロード中...');
    setChip('取得中...', 'loading');

    try {
      const res = await fetch(`/api/videos?url=${encodeURIComponent(url)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const title = (await res.text()).trim();
      setBar(false, 100, '完了');
      setChip('ダウンロード完了', 'ok');

      loadPlayer(title);

    } catch (e) {
      setBar(false, 0, 'エラー');
      setChip(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

 function loadPlayer(title) {
    const vid     = document.getElementById('player');
    const spinner = document.getElementById('videoSpinner');
    const card    = document.getElementById('playerCard');

    document.getElementById('playerTitle').textContent = title;
    spinner.classList.add('on');
    card.classList.add('visible');

    vid.src = `/api/video/${encodeURIComponent(title)}.mp4`;
    vid.load();

    vid.oncanplay  = () => { spinner.classList.remove('on'); vid.play().catch(() => {}); };
    vid.onwaiting  = () => spinner.classList.add('on');
    vid.onplaying  = () => spinner.classList.remove('on');
    vid.onerror    = () => { spinner.classList.remove('on'); alert('再生エラー: ' + vid.error?.message); };

    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
  document.getElementById('urlInput')
    .addEventListener('keydown', e => { if (e.key === 'Enter') startDownload(); });
</script>
</body>
</html>
